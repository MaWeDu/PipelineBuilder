[project]
name = "pipeline-builder"
version = "0.1.0"
description = "Interactive Machine Learning Pipeline Builder with Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "streamlit>=1.61.1",
    "pandas>=2.2,<3.0",
    "numpy>=2.2,<2.4",
    "matplotlib>=3.8,<=3.10",
    "scikit-learn",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "setuptools<81",
]

[tool.uv]
package = false